name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read only. This workflow holds no secret and publishes nothing.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Manila has no daylight saving. Los Angeles does, which catches date bugs.
        tz: [Asia/Manila, America/Los_Angeles]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # JVM and Android host tests. iOS targets are skipped on Linux.
      - name: Check
        run: ./gradlew check
