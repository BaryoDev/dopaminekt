[versions]
kotlin = "2.4.20"
coroutines = "1.11.0"
serialization = "1.12.0"
datetime = "0.8.0"
agp = "9.4.1"
vanniktech-publish = "0.37.0"
# Where the fixtures come from: a public npm release (3.3.1) or a 40 character commit on
# BaryoDev/dopaminejs main. It is a commit until the npm release that carries dopaminejs#80
# is out. Then point it back at that version.
dopaminejs = "9dfeee205b1bb9607f0765404f23bee57e7a8a7e"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
vanniktech-maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktech-publish" }
